name: Deploy SkyCaptain hangar
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            threejs/package-lock.json
      - run: npm ci
      - run: npm ci --prefix threejs
      - name: Verify, build, and package site
        run: npm run ci
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: threejs/dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Install Chromium for public deployment verification
        run: npx --prefix threejs playwright install --with-deps chromium
      - name: Verify actual public Pages resources and rendered aircraft
        timeout-minutes: 8
        env:
          PUBLIC_PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-public-pages.mjs "$PUBLIC_PAGES_URL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-pages-evidence
          path: threejs/test-results/public-pages/
          retention-days: 14
