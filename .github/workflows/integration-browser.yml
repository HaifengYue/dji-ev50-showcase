name: Verify integrated aircraft browsers
on:
  push:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: integration-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    name: Chromium shared hangar
    runs-on: ubuntu-latest
    timeout-minutes: 40 # Software-rendered visual matrix; individual waits and correctness assertions stay unchanged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: threejs/package-lock.json
      - run: npm ci --prefix threejs
      - run: npx --prefix threejs playwright install --with-deps chromium
      - run: npm --prefix threejs run build
      - run: npm --prefix threejs run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hangar-browser-evidence
          path: |
            threejs/playwright-report/
            threejs/test-results/
          retention-days: 14
