<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="EV50 复合翼运载无人机非官方三维外观研究与完整飞行演示"><title>EV50 — 3D Flight Study</title></head><body>
<canvas id="scene" aria-label="EV50 三维展示，可用鼠标拖动观察"></canvas><div id="labels"></div>
<header class="topbar"><div class="brand"><strong>EV50<span style="color:#d4fa79"> /</span></strong><small>3D FLIGHT STUDY</small></div><nav class="modes" aria-label="展示模式"><button id="product" class="active" disabled>产品展示</button><button id="flight" disabled>飞行演示</button></nav></header>
<section class="headline"><div class="eyebrow" id="mode-label">PRODUCT STUDY</div><h1>跨越山海</h1><p id="summary">复合翼运载无人机 · 外观研究</p><p id="load-status">读取三维模型…</p></section>
<aside class="right-tools"><label class="field">观察视角<select id="camera"><option value="free">自由观察</option><option value="ground">地面展示</option><option value="follow">无人机跟随</option><option value="side">侧面电影</option><option value="wide">远景固定</option></select></label><label class="field">画面质量<select id="quality"><option>Low</option><option>Medium</option><option>High</option></select></label><label class="toggle"><input id="annotations" type="checkbox" disabled>部件说明</label></aside>
<section class="flight-info"><div class="status-row"><span class="dot"></span><span id="state">地面待命</span></div><div id="state-code" class="state-code">IDLE</div><div class="metrics"><div class="metric"><span>相对高度</span><strong id="altitude">0.0</strong> <em>m</em></div><div class="metric"><span>垂起旋翼</span><strong id="lift-power">0%</strong></div><div class="metric"><span>巡航推进</span><strong id="cruise-power">0%</strong></div></div></section>
<section class="timeline-panel" aria-label="飞行动画控制"><div class="playback"><button id="play" disabled>播放</button><button id="restart" disabled>重来</button></div><div id="timeline-wrap" class="muted"><div class="timeline-head"><span>完整飞行演示</span><span id="time">00.0 / 60.0 s</span></div><input id="timeline" aria-label="动画时间轴" type="range" min="0" max="60" step="0.01" value="0" disabled><div class="phase-labels"><span>启动</span><span>垂起</span><span>转换</span><span>巡航</span><span>悬停</span><span>降落</span></div></div><div class="options"><label class="toggle"><input id="loop" type="checkbox" checked disabled>循环</label><span class="quality-label" id="quality-readout">HIGH</span></div></section>
<div class="footer-note">非官方视觉研究 · 飞行动作为艺术演示</div><div id="loading" role="status">正在加载 EV50 模型…</div><script type="module" src="/src/main.ts"></script></body></html>
